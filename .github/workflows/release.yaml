name: release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.0.1)
        required: true
        type: string
      branch:
        description: Branch to release
        required: true
        default: main
        type: string

jobs:
  build:
    name: Test and build Windows executables
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      bridgeVersion: ${{ steps.version.outputs.bridgeVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Generate version utilities
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "bridgeVersion=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Record the commit that is built and tagged
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and tests
        run: |
          set -euo pipefail
          go vet ./...
          go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ steps.version.outputs.bridgeVersion }}
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-artifacts
          path: dist/
          if-no-files-found: error

  tag:
    name: Tag release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      githubTag: v${{ needs.build.outputs.bridgeVersion }}
      releaseId: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0

      - name: Create and push tag
        env:
          RELEASE_TAG: v${{ needs.build.outputs.bridgeVersion }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config --local user.name "$ACTOR"
          git config --local user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$BUILD_COMMIT"
          git push origin "$RELEASE_TAG"

      - name: Create draft release
        id: create-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ needs.build.outputs.bridgeVersion }}
          name: v${{ needs.build.outputs.bridgeVersion }}
          draft: true
          prerelease: ${{ contains(needs.build.outputs.bridgeVersion, '-') }}

  publish:
    name: Upload assets and publish release
    needs: [build, tag]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-artifacts
          path: dist

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.tag.outputs.githubTag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check checksums.txt
          gh release upload "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            wslc-bridge-windows-amd64.exe \
            wslc-bridge-windows-arm64.exe \
            checksums.txt \
            bridge-manifest.json \
            --clobber

      - name: Publish release
        uses: StuYarrow/publish-release@01f2a1365bacd77bad861873a7fdf274ab49eefd # v1.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          id: ${{ needs.tag.outputs.releaseId }}
